version: 2

models:
  - name: dim_products
    columns:
      - name: product_id
        data_tests:
          - not_null
          - unique
      - name: product_name
        data_tests:
          - not_null

  - name: dim_customers
    columns:
      - name: customer_id
        data_tests:
          - not_null
          - unique
      - name: email
        data_tests:
          - not_null

  - name: fct_orders
    columns:
      - name: order_id
        data_tests:
          - not_null
          - unique
      - name: customer_id
        data_tests:
          - not_null
      - name: order_date
        data_tests:
          - not_null

  - name: fct_order_items
    columns:
      - name: order_item_id
        data_tests:
          - not_null
          - unique
      - name: order_id
        data_tests:
          - not_null
      - name: product_id
        data_tests:
          - not_null
      - name: line_total
        data_tests:
          - not_null
