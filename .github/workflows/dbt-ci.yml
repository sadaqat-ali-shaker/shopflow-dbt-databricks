
name: dbt CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  validate:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dbt dependencies
        run: |
          python -m pip install --upgrade pip
          pip install dbt-databricks==1.12.6

      - name: Create CI profile
        run: |
          mkdir -p ~/.dbt
          cat > ~/.dbt/profiles.yml <<'EOF'
          shopflow:
            target: ci
            outputs:
              ci:
                type: databricks
                host: https://example.cloud.databricks.com
                http_path: /sql/1.0/warehouses/ci-placeholder
                catalog: ci_catalog
                schema: ci_schema
                token: ci-placeholder
                threads: 1
          EOF

      - name: Validate dbt project
        run: dbt parse --project-dir shopflow --profiles-dir ~/.dbt

